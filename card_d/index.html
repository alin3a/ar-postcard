<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.2.0/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="gaudiEchse" src="./echse.glb"></a-asset-item>
      </a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model
          id="lizard"
          src="#gaudiEchse"
          scale="5 5 5"
          animation-mixer="timeScale: 1">
        </a-gltf-model>
      </a-entity>
    </a-scene>

    <script>
      const scene = document.querySelector('a-scene');
      scene.addEventListener('loaded', () => {
        const lizard = document.getElementById('lizard');
        const radius = 0.3;
        let angle = 0;

        function animate() {
          angle += 0.005;
          const x = Math.cos(angle) * radius;
          const z = Math.sin(angle) * radius;
          // Berechne Fahrtrichtung aus der Bewegungsrichtung
          const nextX = Math.cos(angle + 0.005) * radius;
          const nextZ = Math.sin(angle + 0.005) * radius;
          const deg = Math.atan2(nextX - x, nextZ - z) * (180 / Math.PI);
          lizard.setAttribute('position', `${x} 0 ${z}`);
          lizard.setAttribute('rotation', `0 ${deg} 0`);
          requestAnimationFrame(animate);
        }
        animate();
      });
    </script>
  </body>
</html>
