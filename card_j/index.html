<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #startButton {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      padding: 20px 40px;
      font-size: 20px;
      background: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button id="startButton">start ▶</button>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: true; filterMinCF: 0.0001; filterBeta: 100; missTolerance: 18;"
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights, alpha: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video 
        id="kinder2Video" 
        src="./kinder2.mp4" 
        preload="auto" 
        loop="true" 
        muted 
        playsinline 
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
     <a-entity 
  geometry="primitive: plane; width: 1; height: 0.6667"
  material="shader: chromakey; src: #kinder2Video; color: 0 1 0"
  position="0 0 0">
</a-entity>
    </a-entity>

  </a-scene>

  <script>
    const video = document.querySelector('#kinder2Video');
    const sceneEl = document.querySelector('a-scene');
    const btn = document.querySelector('#startButton');

    // Button einmalig antippen entsperrt Autoplay
    btn.addEventListener('click', () => {
      video.play().then(() => {
        video.pause(); // sofort wieder pausieren
        btn.style.display = 'none'; // Button verstecken
      });
    });

    sceneEl.addEventListener('targetFound', () => {
      video.currentTime = 0;
      video.play();
    });

    sceneEl.addEventListener('targetLost', () => {
      video.pause();
    });
  </script>

</body>
</html>
