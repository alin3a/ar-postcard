<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Wir laden die AR-Bibliotheken direkt aus dem Netz -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <!-- Hier verknüpfen wir deine targets.mind Datei -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <!-- Hier verknüpfen wir dein 3D-Modell -->
        <a-asset-item id="meinModell" src="./modell_a.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- targetIndex: 0 bezieht sich auf das erste Bild in deiner .mind Datei -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Hier kannst du Position, Skalierung und Rotation anpassen -->
        <a-gltf-model src="#meinModell" rotation="0 0 0" position="0 0 0" scale="0.1 0.1 0.1"></a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
